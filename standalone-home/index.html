<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESCLAT Festival</title>
    <style>
      @font-face {
        font-family: "Monument Extended";
        src: url("../src/assets/fonts/MonumentExtended-Regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Monument Extended";
        src: url("../src/assets/fonts/MonumentExtended-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --black: #0a0a0a;
        --true-black: #000;
        --white: #fff;
        --footer: #2a2a2a;
        --muted: #8d8d8d;
        --padding: max(40px, 5vw);
        --font: "Monument Extended", "Arial Narrow", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--black);
        color: var(--white);
        font-family: var(--font);
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 28px var(--padding);
        background: transparent;
      }

      .logo {
        font-size: 14px;
        font-weight: 900;
        line-height: 1;
      }

      .menu-link {
        font-size: 14px;
        font-weight: 400;
        line-height: 1;
      }

      .hero {
        padding: 12vh var(--padding) 0;
      }

      .hero-image {
        width: 100%;
        height: 58vh;
        background: var(--true-black);
      }

      .hero-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        padding-top: 32px;
      }

      .date,
      .location {
        margin: 0;
        font-size: clamp(24px, 3vw, 32px);
        line-height: 1.12;
      }

      .location {
        text-align: right;
      }

      .tagline {
        min-height: 90vh;
        padding: 15vh var(--padding);
      }

      .tagline-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 40px;
        min-height: 60vh;
      }

      .tagline-title {
        display: flex;
        flex-direction: column;
        margin: 0;
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 400;
        line-height: 1.05;
      }

      .more-info {
        padding-bottom: 0.45em;
        font-size: 13px;
        line-height: 1;
      }

      .more-info:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .footer {
        background: var(--footer);
        padding: 44px var(--padding) 26px;
      }

      .footer-top {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
      }

      .footer-label {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1;
      }

      .logo-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 24px;
      }

      .footer-logo-text {
        font-size: 18px;
        font-weight: 900;
        line-height: 1;
      }

      .logo-row img {
        max-height: 28px;
        width: auto;
        filter: brightness(0) invert(1);
      }

      .footer-divider {
        height: 1px;
        margin: 44px 0 20px;
        background: rgb(255 255 255 / 18%);
      }

      .footer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .legal {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }

      .socials {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .socials svg {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--white);
        stroke-width: 1.7;
      }

      @media (max-width: 760px) {
        .hero-meta,
        .tagline-grid,
        .footer-top,
        .footer-bottom {
          grid-template-columns: 1fr;
        }

        .location {
          text-align: left;
        }

        .footer-bottom {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#">ESCLAT</a>
      <a class="menu-link" href="#">MENÚ</a>
    </header>

    <main>
      <section class="hero" aria-label="Inicio">
        <div class="hero-image" aria-hidden="true"></div>

        <div class="hero-meta">
          <p class="date">23.10—<br />25.10.26</p>
          <p class="location">LAS NAVES<br />VALENCIA</p>
        </div>
      </section>

      <section class="tagline" aria-label="Festival">
        <div class="tagline-grid">
          <h1 class="tagline-title">
            <span>FESTIVAL DE MÚSICA,</span>
            <span>PENSAMIENTO Y</span>
            <span>CREATIVIDAD</span>
          </h1>

          <a class="more-info" href="#">MÁS INFORMACIÓN</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-top">
        <section>
          <p class="footer-label">COLABORA</p>
          <div class="logo-row">
            <span class="footer-logo-text">ESCLAT</span>
            <img src="assets/logos/Ajuntament de Valencia.png" alt="Ajuntament de Valencia" />
            <img src="assets/logos/Las Naves.png" alt="Las Naves" />
          </div>
        </section>

        <section>
          <p class="footer-label">ORGANIZA</p>
          <div class="logo-row">
            <img src="assets/logos/Diputacio de Valencia.png" alt="Diputacio de Valencia" />
            <img src="assets/logos/IVAJ.png" alt="IVAJ" />
            <img src="assets/logos/Turia.png" alt="Turia" />
            <img src="assets/logos/Cocacola.png" alt="Cocacola" />
          </div>
        </section>
      </div>

      <div class="footer-divider"></div>

      <div class="footer-bottom">
        <p class="legal">
          © 2026 ESCLAT FESTIVAL | TÉRMINOS Y CONDICIONES · AVISO LEGAL ·
          POLÍTICA DE PRIVACIDAD · POLÍTICA DE COOKIES
        </p>

        <nav class="socials" aria-label="Redes sociales">
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17" cy="7" r="1"></circle>
            </svg>
          </a>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5l14 14M19 5L5 19"></path>
            </svg>
          </a>
          <a href="#" aria-label="TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 6v10a3 3 0 1 1-3-3"></path>
              <path d="M10 6c2.5 3 4.5 4 7 4"></path>
            </svg>
          </a>
        </nav>
      </div>
    </footer>
  </body>
</html>
